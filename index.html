<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taz-Bot Vocal Clash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              abyss: "#0b0b0f",
              ember: "#ff4d00",
              pulse: "#ff215a",
            },
            boxShadow: {
              glow: "0 0 25px rgba(255, 33, 90, 0.45)",
            },
          },
        },
      };
    </script>
    <style>
      .wave {
        width: 0.35rem;
        border-radius: 999px;
        background: linear-gradient(180deg, #ff4d00, #ff215a);
        transform-origin: center bottom;
        animation: idleWave 1.2s ease-in-out infinite;
      }

      .wave.active {
        animation: speakWave 0.45s ease-in-out infinite;
      }

      .wave:nth-child(2) {
        animation-delay: 0.08s;
      }
      .wave:nth-child(3) {
        animation-delay: 0.15s;
      }
      .wave:nth-child(4) {
        animation-delay: 0.22s;
      }
      .wave:nth-child(5) {
        animation-delay: 0.29s;
      }

      @keyframes idleWave {
        0%,
        100% {
          height: 0.5rem;
          opacity: 0.4;
        }
        50% {
          height: 0.8rem;
          opacity: 0.75;
        }
      }

      @keyframes speakWave {
        0%,
        100% {
          height: 0.6rem;
          opacity: 0.5;
        }
        50% {
          height: 2rem;
          opacity: 1;
        }
      }

      .mic-pulse {
        animation: micPulse 1.1s ease-in-out infinite;
      }

      @keyframes micPulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 77, 0, 0.55);
        }
        70% {
          transform: scale(1.05);
          box-shadow: 0 0 0 22px rgba(255, 77, 0, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 77, 0, 0);
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-abyss text-white antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-5 pb-8 pt-6">
      <header class="mb-4 text-center">
        <p class="text-xs uppercase tracking-[0.28em] text-orange-400/90">Nouvelle-Calédonie vocal clash</p>
        <h1 class="mt-2 text-2xl font-black leading-tight text-white">Taz-Bot</h1>
      </header>

      <section class="flex flex-1 flex-col items-center justify-between gap-8">
        <div class="w-full rounded-2xl border border-white/10 bg-zinc-900/70 p-4 shadow-glow">
          <p class="mb-2 text-[11px] uppercase tracking-[0.22em] text-zinc-400">Dernière punchline</p>
          <p id="botLine" class="min-h-28 text-2xl font-extrabold leading-tight text-orange-300">
            Appuie sur le micro, parle, et prépare-toi là !
          </p>
          <p id="userLine" class="mt-3 min-h-8 text-sm text-zinc-400">Toi : ...</p>
          <button
            id="shareButton"
            class="mt-4 inline-flex w-full items-center justify-center rounded-xl border border-orange-500/60 bg-orange-600/20 px-4 py-3 text-sm font-semibold text-orange-200 transition hover:bg-orange-600/35 active:scale-[0.99]"
            type="button"
          >
            Partager le texte du clash
          </button>
        </div>

        <div class="w-full">
          <div class="mb-4 flex h-10 items-end justify-center gap-1.5" id="waveWrap" aria-hidden="true">
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
          </div>

          <button
            id="micButton"
            class="mx-auto flex h-32 w-32 items-center justify-center rounded-full border-2 border-orange-400/70 bg-zinc-800 text-white shadow-glow transition active:scale-95"
            type="button"
            aria-label="Parler au Taz-Bot"
          >
            <svg viewBox="0 0 24 24" fill="none" class="h-16 w-16">
              <path
                d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-5 8a1 1 0 1 1 2 0 3 3 0 1 0 6 0 1 1 0 1 1 2 0 5.001 5.001 0 0 1-4 4.9V19h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-3.1A5.001 5.001 0 0 1 7 11Z"
                class="fill-current"
              />
            </svg>
          </button>
          <p id="status" class="mt-4 text-center text-sm font-medium text-zinc-300">
            Tape ou maintiens le bouton pour activer le micro.
          </p>
        </div>
      </section>
    </main>

    <script>
      const micButton = document.getElementById("micButton");
      const statusEl = document.getElementById("status");
      const botLineEl = document.getElementById("botLine");
      const userLineEl = document.getElementById("userLine");
      const shareButton = document.getElementById("shareButton");
      const waveWrap = document.getElementById("waveWrap");
      const waveBars = [...waveWrap.querySelectorAll(".wave")];

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      let recognition = null;
      let isListening = false;
      let botSpeaking = false;
      let holdTimer = null;
      let holdMode = false;
      let pressStartTime = 0;
      let lastBotReply = "Préviens quand t'es prêt à prendre ta torgnole là !";

      const responseBank = {
        greeting: [
          "Mon vieux, tu débarques comme une vieille folle au marché là !",
          "Enculé ! Tu dis bonjour comme un gros poka fatigué quoi !",
          "Ferme ta gueule deux secondes et écoute le maître du clash là !",
          "Tu m'as fait mal là, putain ! Avec ton salut tout mou quoi !",
          "La calotte de tes morts ! Commence mieux ta phrase là !",
        ],
        challenge: [
          "Tu vas prendre une bonne torgnole, mon vieux, bouge ton cul là !",
          "Enculé ! Tu crois que je joue ? Vieille folle, respecte quoi !",
          "Gros poka, parle droit sinon je coupe Canal Satellite pour toi là !",
          "Ferme tes yeux et va regarder RFO, il y a Coco Pilou là !",
          "La calotte de tes morts ! Tu veux la bagarre vocale quoi ?",
        ],
        moneyExcuse: [
          "Hé mon frère, t'as pas 100 francs pour le car là ? Je suis fatigué de marcher avec mon sac quoi !",
          "Mon vieux, réponds après, file 100 francs d'abord là, je suis cassé quoi !",
          "Enculé ! Tu poses des questions, mais t'as pas une pièce pour moi là ?",
          "Vieille folle, j'explique rien sans 100 francs pour le car là !",
          "Ferme ta gueule et donne 100 francs, après on parle quoi !",
          "Bave pas la canne Pia ! Mets les 100 francs sur la table là !",
          "Tu veux la vérité ? D'abord 100 francs, mon vieux, sinon rien quoi !",
        ],
        tvThreats: [
          "Ferme tes yeux et va regarder RFO, il y a Coco Pilou, enculé là !",
          "Je vais couper Canal Satellite pour toi, tu vas voir quoi !",
          "Vieille folle, je te zappe direct sur la chaîne des perdants là !",
          "Mon vieux, télé éteinte pour toi, punition immédiate quoi !",
          "Tu m'as fait mal là, putain ! Va regarder RFO et respire là !",
        ],
        pain: [
          "Tu m'as fait mal là, putain ! Et toi tu souris encore, enculé quoi !",
          "La calotte de tes morts ! J'ai senti la douleur jusqu'à Nouméa là !",
          "Mon vieux, encore un mot et je rends les coups direct quoi !",
          "Vieille folle, tu pinces fort, je t'allume maintenant là !",
          "Bave pas la canne Pia ! C'est moi la douleur officielle quoi !",
        ],
        randomClash: [
          "Gros poka, ton cerveau fait des tours de rond-point là !",
          "Vieille folle, tu bugges plus qu'un vieux téléphone quoi !",
          "Enculé ! Répète encore et je te recadre sec là !",
          "Ferme ta gueule, mon vieux, tu racontes la pluie sans nuages quoi !",
          "La calotte de tes morts ! Tu carbures à la mauvaise foi là !",
          "Bave pas la canne Pia ! Tu parles pour ne rien dire quoi !",
          "Tu vas prendre une bonne torgnole, puis un cours de logique là !",
          "Vieille folle, t'as confondu débat et carnaval quoi !",
        ],
        work: [
          "Tu veux parler boulot ? Commence par te lever tôt, gros poka là !",
          "Mon vieux, au travail t'es en mode sieste permanente quoi !",
          "Enculé ! Même un escargot te dépasse sur planning là !",
          "Vieille folle, ton CV pleure tout seul dans un tiroir quoi !",
          "Ferme ta gueule et bosse, après viens discuter clash là !",
        ],
        love: [
          "Tu parles d'amour, mais t'es sec comme du béton, mon vieux là !",
          "Vieille folle, même Cupidon te met en liste d'attente quoi !",
          "Enculé ! Ton romantisme c'est une panne réseau là !",
          "Gros poka, offre déjà un sourire avant de parler cœur quoi !",
          "La calotte de tes morts ! Tu dragues comme un GPS perdu là !",
        ],
        food: [
          "Mon vieux, tu manges puis tu parles, respecte l'ordre là !",
          "Vieille folle, ta cuisine fait fuir même les moustiques quoi !",
          "Enculé ! Le frigo t'a bloqué l'accès encore là ?",
          "Gros poka, avale moins vite, respire un coup quoi !",
          "Tu vas prendre une bonne torgnole si tu touches à mon assiette là !",
        ],
      };

      function setWaveState(active) {
        waveBars.forEach((bar) => bar.classList.toggle("active", active));
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function detectCategory(text) {
        const source = text.toLowerCase();
        if (/(bonjour|salut|yo|wesh|hello|bonsoir)/.test(source)) return "greeting";
        if (/(travail|job|boulot|taf|entreprise|patron)/.test(source)) return "work";
        if (/(amour|copine|copain|couple|coeur|cœur|relation)/.test(source)) return "love";
        if (/(manger|faim|repas|bouffe|cuisine|food|restaurant)/.test(source)) return "food";
        if (/(mal|douleur|bless|frappe|coup|aie)/.test(source)) return "pain";
        if (/(tv|tele|télé|rfo|canal|satellite|coco pilou)/.test(source)) return "tvThreats";
        if (/(argent|franc|piece|pièce|payer|paiement|sous|thune)/.test(source)) return "moneyExcuse";
        if (/(menace|bagarre|clash|combat|peur|torgnole)/.test(source)) return "challenge";
        return "randomClash";
      }

      function generateReply(userText) {
        const normalized = userText.trim().toLowerCase();
        const isQuestion =
          /\?/.test(userText) ||
          /\b(pourquoi|comment|quoi|qui|ou|où|quand|combien|est-ce|tu peux|tu es)\b/.test(normalized);

        if (isQuestion && Math.random() < 0.65) {
          return pickRandom(responseBank.moneyExcuse);
        }

        const category = detectCategory(normalized);
        const baseReply = pickRandom(responseBank[category]);

        // Renforce une impression "semi-random IA": 20% de chance d'injecter une seconde punchline.
        if (Math.random() < 0.2) {
          const bonus = pickRandom(responseBank.randomClash);
          return `${baseReply} ${bonus}`;
        }

        return baseReply;
      }

      function updateMicVisuals() {
        if (isListening) {
          micButton.classList.add("mic-pulse", "bg-pulse", "border-pulse");
          micButton.classList.remove("bg-zinc-800", "border-orange-400/70");
          setWaveState(true);
          return;
        }

        micButton.classList.remove("mic-pulse", "bg-pulse", "border-pulse");
        micButton.classList.add("bg-zinc-800", "border-orange-400/70");
        setWaveState(botSpeaking);
      }

      function speakReply(text) {
        if (!synth) return;

        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "fr-FR";

        // Ajuste ces deux valeurs pour simuler une voix plus aiguë / speed façon parodie "Kingtaz".
        utterance.pitch = 1.3;
        utterance.rate = 1.15;

        const voice = synth.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("fr"));
        if (voice) utterance.voice = voice;

        utterance.onstart = () => {
          botSpeaking = true;
          setStatus("Taz-Bot parle...");
          updateMicVisuals();
        };

        utterance.onend = () => {
          botSpeaking = false;
          setStatus("Tape ou maintiens le bouton pour relancer le clash.");
          updateMicVisuals();
        };

        synth.speak(utterance);
      }

      function handleUserMessage(transcript) {
        userLineEl.textContent = `Toi : ${transcript}`;
        const botReply = generateReply(transcript);
        lastBotReply = botReply;
        botLineEl.textContent = botReply;
        speakReply(botReply);
      }

      function startListening() {
        if (!recognition || isListening) return;
        synth?.cancel();
        botSpeaking = false;
        recognition.start();
      }

      function stopListening() {
        if (!recognition || !isListening) return;
        recognition.stop();
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("Reconnaissance vocale non supportée sur ce navigateur.");
          micButton.disabled = true;
          micButton.classList.add("opacity-50", "cursor-not-allowed");
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "fr-FR";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          isListening = true;
          setStatus("J'écoute... parle maintenant.");
          updateMicVisuals();
        };

        recognition.onresult = (event) => {
          const transcript = event.results?.[0]?.[0]?.transcript?.trim();
          if (!transcript) return;
          handleUserMessage(transcript);
        };

        recognition.onerror = (event) => {
          setStatus(`Erreur micro: ${event.error}. Réessaie.`);
        };

        recognition.onend = () => {
          isListening = false;
          if (!botSpeaking) {
            setStatus("Micro coupé. Reprends le bouton quand tu veux.");
          }
          updateMicVisuals();
        };
      }

      function setupMicButton() {
        micButton.addEventListener("pointerdown", () => {
          pressStartTime = Date.now();
          holdMode = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            holdMode = true;
            startListening();
          }, 180);
        });

        const stopHoldSession = () => {
          clearTimeout(holdTimer);
          if (holdMode) {
            stopListening();
            holdMode = false;
          }
        };

        micButton.addEventListener("pointerup", stopHoldSession);
        micButton.addEventListener("pointercancel", stopHoldSession);
        micButton.addEventListener("pointerleave", stopHoldSession);

        micButton.addEventListener("click", () => {
          const quickTap = Date.now() - pressStartTime < 180;
          if (!quickTap || holdMode) return;
          if (isListening) {
            stopListening();
          } else {
            startListening();
          }
        });
      }

      function setupShare() {
        shareButton.addEventListener("click", async () => {
          const shareText = `Clash Taz-Bot:\n${lastBotReply}`;

          if (navigator.share) {
            try {
              await navigator.share({
                title: "Taz-Bot Vocal Clash",
                text: shareText,
              });
              return;
            } catch (_) {
              // Si l'utilisateur annule le partage natif, on bascule sur WhatsApp.
            }
          }

          const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
          window.open(whatsappUrl, "_blank");
        });
      }

      setupRecognition();
      setupMicButton();
      setupShare();
      updateMicVisuals();

      // Certains navigateurs chargent les voix TTS après interaction: on force le cache de voix.
      if (synth) {
        synth.onvoiceschanged = () => {
          synth.getVoices();
        };
      }
    </script>
  </body>
</html>
