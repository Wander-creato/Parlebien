<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Taz-Bot NC - Clash Vocal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coal: '#050505',
            asphalt: '#101010',
            ember: '#ff3d00',
            danger: '#ff1744',
            neon: '#ff8a00'
          },
          boxShadow: {
            hot: '0 0 42px rgba(255, 61, 0, 0.45)',
            burn: '0 0 80px rgba(255, 23, 68, 0.42)'
          },
          fontFamily: {
            clash: ['Impact', 'Arial Black', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      background:
        radial-gradient(circle at 50% 5%, rgba(255, 61, 0, 0.20), transparent 34rem),
        radial-gradient(circle at 15% 80%, rgba(255, 138, 0, 0.11), transparent 18rem),
        linear-gradient(160deg, #050505 0%, #111 45%, #050505 100%);
      min-height: 100svh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .noise::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.10) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .wave {
      width: 0.52rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff8a00, #ff1744);
      opacity: 0.32;
      transform-origin: center;
      animation: idleWave 1.6s ease-in-out infinite;
    }

    .is-speaking .wave,
    .is-listening .wave {
      opacity: 1;
      animation-name: hotWave;
      animation-duration: 0.72s;
    }

    .wave:nth-child(2) { animation-delay: 0.08s; }
    .wave:nth-child(3) { animation-delay: 0.16s; }
    .wave:nth-child(4) { animation-delay: 0.24s; }
    .wave:nth-child(5) { animation-delay: 0.32s; }
    .wave:nth-child(6) { animation-delay: 0.40s; }
    .wave:nth-child(7) { animation-delay: 0.48s; }

    @keyframes idleWave {
      0%, 100% { height: 1.2rem; transform: scaleY(0.72); }
      50% { height: 2.2rem; transform: scaleY(1); }
    }

    @keyframes hotWave {
      0%, 100% { height: 1.4rem; transform: scaleY(0.82); filter: drop-shadow(0 0 4px rgba(255, 61, 0, 0.8)); }
      35% { height: 4.4rem; transform: scaleY(1.08); filter: drop-shadow(0 0 16px rgba(255, 23, 68, 1)); }
      70% { height: 2.6rem; transform: scaleY(0.94); }
    }

    .mic-core {
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,0.22), transparent 18%),
        linear-gradient(145deg, #2a2a2a, #080808);
    }

    .is-listening .mic-core {
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,0.30), transparent 18%),
        linear-gradient(145deg, #ff1744, #7a061b 62%, #180006);
      animation: listenPulse 1s ease-in-out infinite;
    }

    @keyframes listenPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 32px rgba(255, 23, 68, 0.52); }
      50% { transform: scale(1.06); box-shadow: 0 0 76px rgba(255, 23, 68, 0.76); }
    }

    .punchline-enter {
      animation: punchIn 0.22s ease-out;
    }

    @keyframes punchIn {
      from { transform: translateY(10px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="noise text-white antialiased">
  <main id="app" class="mx-auto flex min-h-svh w-full max-w-md flex-col px-4 pb-[calc(1rem+var(--safe-bottom))] pt-4 sm:max-w-xl">
    <header class="flex items-center justify-between gap-3">
      <div>
        <p class="text-xs font-black uppercase tracking-[0.32em] text-neon">Nouvelle-Caledonie</p>
        <h1 class="font-clash text-3xl uppercase leading-none tracking-tight text-white drop-shadow sm:text-4xl">
          Taz-Bot NC
        </h1>
      </div>
      <span id="supportBadge" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[0.68rem] font-bold uppercase tracking-wider text-white/65">
        Vocal only
      </span>
    </header>

    <section class="mt-5 flex flex-1 flex-col justify-between rounded-[2rem] border border-white/10 bg-black/30 p-4 shadow-2xl backdrop-blur">
      <div class="space-y-4">
        <div class="rounded-[1.6rem] border border-ember/25 bg-gradient-to-br from-white/[0.09] to-white/[0.02] p-4 shadow-hot">
          <div class="flex items-center justify-between gap-3">
            <p id="botStatus" class="text-xs font-black uppercase tracking-[0.22em] text-neon">Pret a clasher</p>
            <div id="soundWave" class="flex h-16 items-center gap-1.5" aria-hidden="true">
              <span class="wave"></span>
              <span class="wave"></span>
              <span class="wave"></span>
              <span class="wave"></span>
              <span class="wave"></span>
              <span class="wave"></span>
              <span class="wave"></span>
            </div>
          </div>

          <p id="punchline" class="mt-4 min-h-44 text-balance font-clash text-[2.55rem] uppercase leading-[0.94] tracking-tight text-white sm:text-6xl">
            Appuie, parle, et encaisse la reponse la.
          </p>
        </div>

        <div class="grid grid-cols-1 gap-3 text-sm text-white/70">
          <div class="rounded-2xl border border-white/10 bg-asphalt/80 p-3">
            <p class="text-[0.68rem] font-black uppercase tracking-[0.2em] text-white/40">Toi</p>
            <p id="transcript" class="mt-1 min-h-6 font-semibold text-white/85">Aucune phrase captee pour le moment.</p>
          </div>

          <button id="shareBtn" type="button" class="rounded-2xl border border-emerald-400/25 bg-emerald-500/10 px-4 py-3 text-left font-black uppercase tracking-wide text-emerald-200 transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-40">
            Partager le texte du clash sur WhatsApp
          </button>
        </div>
      </div>

      <div class="mt-6 flex flex-col items-center">
        <button id="micButton" type="button" class="mic-core relative grid h-44 w-44 place-items-center rounded-full border border-white/10 shadow-burn transition active:scale-95 sm:h-52 sm:w-52" aria-label="Parler au Taz-Bot" aria-pressed="false">
          <span class="absolute inset-[-14px] rounded-full border border-ember/20"></span>
          <span class="absolute inset-[-28px] rounded-full border border-danger/10"></span>
          <svg class="h-20 w-20 text-white drop-shadow-[0_0_18px_rgba(255,255,255,0.28)]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 14.75a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v4.75a4 4 0 0 0 4 4Z" fill="currentColor"/>
            <path d="M5.75 10.5a.75.75 0 0 1 1.5 0 4.75 4.75 0 1 0 9.5 0 .75.75 0 0 1 1.5 0 6.25 6.25 0 0 1-5.5 6.21v2.04h2.75a.75.75 0 0 1 0 1.5h-7a.75.75 0 0 1 0-1.5h2.75v-2.04a6.25 6.25 0 0 1-5.5-6.21Z" fill="currentColor"/>
          </svg>
        </button>
        <p id="hint" class="mt-4 text-center text-sm font-bold uppercase tracking-[0.18em] text-white/55">
          Tape ou garde appuye pour parler
        </p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const micButton = document.getElementById('micButton');
      const punchlineEl = document.getElementById('punchline');
      const transcriptEl = document.getElementById('transcript');
      const statusEl = document.getElementById('botStatus');
      const shareBtn = document.getElementById('shareBtn');
      const supportBadge = document.getElementById('supportBadge');
      const hintEl = document.getElementById('hint');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const hasSpeechRecognition = Boolean(SpeechRecognition);
      const hasSpeechSynthesis = 'speechSynthesis' in window;

      let recognition = null;
      let isListening = false;
      let isSpeaking = false;
      let finalTranscript = '';
      let lastPunchline = punchlineEl.textContent.trim();
      let holdMode = false;
      let holdTimer = null;
      let suppressNextClick = false;
      let recognitionHadError = false;

      const fillerOpeners = [
        'Ecoute bien',
        'Mon vieux',
        'He gros poka',
        'Sans deconner',
        'Je te le dis sec',
        'Regarde-moi ca',
        'Oh la vieille folle',
        'Encule',
        'Ferme ta gueule deux secondes'
      ];

      const endings = [
        'la',
        'quoi',
        'mon vieux',
        'arrete la',
        'tu vas voir',
        'putain',
        'gros poka'
      ];

      const keywordReplies = [
        {
          name: 'argent',
          keywords: ['argent', 'franc', 'francs', 'payer', 'cher', 'prix', 'budget', 'credit', 'cb', 'monnaie'],
          replies: [
            'He mon frere, t\'as pas 100 francs pour le car la ? Je suis fatigue de marcher avec mon sac, quoi.',
            'Tu parles d\'argent mais tes poches font plus de bruit que ton cerveau, gros poka.',
            'Donne 100 francs avant de poser ta question, sinon je coupe Canal Satellite pour toi, tu vas voir !',
            'Ton budget il est plus maigre qu\'un moustique de brousse, encule, arrete la.',
            'La gratte d\'abord, la reponse apres, mon vieux. C\'est la loi du trottoir la.'
          ]
        },
        {
          name: 'transport',
          keywords: ['bus', 'car', 'taxi', 'route', 'rouler', 'voiture', 'velo', 'marcher', 'trafic', 'parking'],
          replies: [
            'Le car ? He mon frere, t\'as pas 100 francs pour le car la ? Je suis fatigue de marcher avec mon sac.',
            'Ta route elle est cabossee comme ton raisonnement, tu es con quoi ?',
            'Monte pas dans ma voiture avec cette question moisie, bave pas la canne Pia !',
            'Tu vas marcher jusqu\'a RFO et regarder Coco Pilou pour reflechir, la.',
            'T\'as rate le bus et la logique en meme temps, vieille folle.'
          ]
        },
        {
          name: 'salut',
          keywords: ['salut', 'bonjour', 'bonsoir', 'hello', 'yo', 'wesh', 'coucou', 'ia', 'bot'],
          replies: [
            'Salut salut ? On est pas au salon de the, parle fort ou bouge ton cul la !',
            'Bonjour mon vieux, maintenant crache ta question avant que je te mette la calotte de tes morts.',
            'Yo gros poka, je suis reveille et deja enerve, quoi.',
            'Coucou ? Tu m\'as pris pour une vieille folle ou quoi ? Allez, parle la !',
            'Taz-Bot connecte, et toi deconnecte du cerveau, encule.'
          ]
        },
        {
          name: 'amour',
          keywords: ['amour', 'aime', 'copine', 'copain', 'crush', 'coeur', 'couple', 'mariage', 'date'],
          replies: [
            'Ton histoire d\'amour sent la gratte et le sandwich froid, mon vieux.',
            'Dis-lui je t\'aime, et si elle rigole tu vas prendre une bonne torgnole morale la.',
            'Le coeur ? Ferme ta gueule, ton coeur il capte moins bien que Canal Satellite sous la pluie.',
            'Ta romance c\'est RFO a minuit : personne regarde, quoi.',
            'Arrete de baver la canne Pia sur ton crush, respire et parle normal la.'
          ]
        },
        {
          name: 'travail',
          keywords: ['travail', 'job', 'boulot', 'patron', 'chef', 'bureau', 'collegue', 'stage', 'cv', 'emploi'],
          replies: [
            'Au boulot tu dois etre le bug principal, mon vieux, bouge ton cul la !',
            'Ton patron t\'a vu arriver il a dit vieille folle en silencieux, quoi.',
            'Fais ton CV sans mentir, deja ca va etre une feuille blanche, gros poka.',
            'Le travail c\'est simple : tu fermes ta gueule, tu cliques, tu livres, la.',
            'Si ton chef parle trop, dis-lui je vais couper Canal Satellite pour toi, tu vas voir !'
          ]
        },
        {
          name: 'ecole',
          keywords: ['ecole', 'cours', 'devoir', 'examen', 'bac', 'prof', 'classe', 'etude', 'math', 'revision'],
          replies: [
            'Tes devoirs ? Tu vas prendre une bonne torgnole si tu les fais avec ce niveau, la.',
            'Le prof explique et toi tu regardes Coco Pilou dans ta tete, gros poka.',
            'Revision express : arrete de pleurer, ouvre le cahier, ferme ta gueule, quoi.',
            'La calotte de tes morts si tu rends encore une copie vide, mon vieux.',
            'Les maths te regardent et disent : tu es con quoi ?'
          ]
        },
        {
          name: 'meteo',
          keywords: ['meteo', 'pluie', 'soleil', 'cyclone', 'vent', 'chaud', 'froid', 'nuage', 'temps'],
          replies: [
            'La meteo ? Il pleut dans ton cerveau depuis ce matin, mon vieux.',
            'S\'il fait chaud, bois de l\'eau et arrete de baver la canne Pia, quoi.',
            'Cyclone ou pas, ta question elle a deja arrache le toit de la logique, la.',
            'Le vent souffle moins fort que tes excuses, vieille folle.',
            'Regarde dehors au lieu de demander a un bot enerve, gros poka.'
          ]
        },
        {
          name: 'manger',
          keywords: ['manger', 'faim', 'bouffe', 'repas', 'restaurant', 'cafe', 'cuisine', 'riz', 'poulet'],
          replies: [
            'T\'as faim ? Moi aussi, donne 100 francs avant que je morde le micro la.',
            'Ton repas il manque de sel, comme ta phrase manque de sens, quoi.',
            'Va manger avant de tomber par terre comme une vieille folle, mon vieux.',
            'Tu veux une recette ? Ferme ta gueule et commence par ne pas bruler l\'eau, gros poka.',
            'Bave pas la canne Pia sur le poulet, partage ou tu vas voir !'
          ]
        },
        {
          name: 'tech',
          keywords: ['telephone', 'portable', 'internet', 'wifi', 'bug', 'site', 'app', 'code', 'ordinateur', 'reseau'],
          replies: [
            'Ton bug il vient pas du telephone, il vient de tes doigts, encule, arrete la.',
            'Redemarre l\'app et ton cerveau avec, gros poka.',
            'Le Wi-Fi fuit quand il entend ta question, mon vieux.',
            'Je vais couper Canal Satellite pour toi et peut-etre Internet aussi, tu vas voir !',
            'Ton code crie tu m\'as fait mal la, putain !'
          ]
        },
        {
          name: 'question',
          keywords: ['pourquoi', 'comment', 'quoi', 'quand', 'qui', 'ou', 'est-ce', '?'],
          replies: [
            'Pourquoi, pourquoi... He mon frere, t\'as pas 100 francs pour le car la ? Je suis fatigue de marcher avec mon sac.',
            'Je pourrais repondre, mais ta question me donne envie de regarder RFO, il y a Coco Pilou, quoi.',
            'Comment ? Avec les mains et un peu de cerveau, gros poka, arrete la !',
            'Tu veux la verite ou une bonne torgnole ? Parce que la verite va piquer, mon vieux.',
            'Pose ca mieux, vieille folle, la phrase elle boite comme un pneu creve.'
          ]
        }
      ];

      const randomReplies = [
        'Gros poka, ta phrase vient d\'entrer et mon respect vient de sortir la.',
        'Vieille folle, tu secoues l\'air pour rien, quoi.',
        'Tu m\'as fait mal la, putain ! Pas physiquement, intellectuellement.',
        'La calotte de tes morts si tu me ressors une phrase pareille.',
        'Tu vas prendre une bonne torgnole grammaticale, mon vieux.',
        'Ferme tes yeux et va regarder RFO, il y a Coco Pilou !',
        'Je vais couper Canal Satellite pour toi, tu vas voir !',
        'Bave pas la canne Pia, respire et recommence propre la.',
        'Encule, meme le micro a recule quand tu as parle.',
        'Ferme ta gueule deux secondes, je cherche le sens et je le trouve pas.',
        'Bouge ton cul la, la reponse ne va pas venir en rampant.',
        'Tu es con quoi ? Je demande pour le dossier, mon vieux.',
        'Arrete la ! Ton idee a glisse dans le caniveau.',
        'Ton niveau fait peur aux moustiques, gros poka.',
        'Je t\'ecoute et j\'ai envie de deposer plainte contre la logique.',
        'Si la betise etait un lagon, tu serais maree haute la.',
        'Parle moins flou, meme la radio capte mieux que toi, quoi.',
        'Mon vieux, ton plan a moins de tenue qu\'une tong cassee.',
        'Ta phrase tourne en rond comme un coq devant un miroir.',
        'Tu viens de lancer une question et elle est tombee dans le trou, encule.',
        'On dirait une idee trouvee derriere le snack, la.',
        'Je respecte l\'effort, mais pas le resultat, vieille folle.',
        'Ton cerveau est en mode economie de batterie, quoi.',
        'Meme Coco Pilou aurait zappe, mon vieux.',
        'Va boire de l\'eau, lave ta pensee, et reviens la.',
        'Je suis pas ton GPS mental, gros poka.',
        'La prochaine phrase, mets-lui des chaussures, elle marche pas.',
        'Trop de bruit, pas assez de sens, ferme ta gueule la.',
        'Ton discours sent la gratte a 100 francs, quoi.',
        'Tu veux un conseil ? Commence par survivre a ta propre question.',
        'Je vais te repondre sec : non, oui, peut-etre, et debrouille-toi la.',
        'Si tu cherches la paix, t\'as appele le mauvais demon vocal, mon vieux.',
        'Ta demande est arrivee en retard et mal coiffee, gros poka.',
        'J\'ai entendu, j\'ai juge, j\'ai souffert, putain.',
        'Range ton cinema, on n\'est pas a Canal Satellite la.',
        'Ta logique a pris le car sans payer, quoi.',
        'Torgnole verbale livree, signature obligatoire mon vieux.',
        'Arrete de tourner autour du pot, le pot a porte plainte.',
        'La reponse est simple : fais mieux, parle net, bouge-toi la.',
        'Tu poses ca comme si j\'etais patient. Erreur fatale, encule.'
      ];

      function normalizeText(text) {
        return text
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[\u2019]/g, "'");
      }

      function pickRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function buildReply(rawText) {
        const normalized = normalizeText(rawText);
        const matches = keywordReplies.filter(group =>
          group.keywords.some(keyword => normalized.includes(normalizeText(keyword)))
        );

        const replyPool = matches.length
          ? matches.flatMap(group => group.replies)
          : randomReplies;

        let reply = pickRandom(replyPool);

        // Petite variation locale pour eviter une impression trop mecanique.
        if (Math.random() > 0.64) {
          reply = `${pickRandom(fillerOpeners)} ! ${reply}`;
        }

        if (!/[.!?]$/.test(reply)) {
          reply = `${reply} ${pickRandom(endings)}.`;
        } else if (Math.random() > 0.54) {
          reply = `${reply.replace(/[.!?]$/, '')}, ${pickRandom(endings)}.`;
        }

        return reply;
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function setPunchline(text) {
        lastPunchline = text;
        punchlineEl.textContent = text;
        punchlineEl.classList.remove('punchline-enter');
        void punchlineEl.offsetWidth;
        punchlineEl.classList.add('punchline-enter');
        shareBtn.disabled = false;
      }

      function setListeningState(nextState) {
        isListening = nextState;
        app.classList.toggle('is-listening', isListening);
        micButton.setAttribute('aria-pressed', String(isListening));
        hintEl.textContent = isListening ? 'Je t ecoute, crache tout' : 'Tape ou garde appuye pour parler';
      }

      function setSpeakingState(nextState) {
        isSpeaking = nextState;
        app.classList.toggle('is-speaking', isSpeaking);
      }

      function selectFrenchVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(voice => voice.lang === 'fr-FR')
          || voices.find(voice => voice.lang.toLowerCase().startsWith('fr'))
          || voices[0]
          || null;
      }

      function speak(text) {
        if (!hasSpeechSynthesis) {
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.voice = selectFrenchVoice();

        // Ajuster ici pour simuler une voix Kingtaz qui part dans les aigus :
        // augmenter pitch (ex: 1.35) et rate (ex: 1.45) pour une diction plus nerveuse.
        utterance.pitch = 1.15;
        utterance.rate = 1.28;
        utterance.volume = 1;

        utterance.onstart = () => {
          setSpeakingState(true);
          setStatus('Le bot gueule');
        };

        utterance.onend = () => {
          setSpeakingState(false);
          setStatus('Pret a clasher');
        };

        utterance.onerror = () => {
          setSpeakingState(false);
          setStatus('Synthese vocale bloquee');
        };

        window.speechSynthesis.speak(utterance);
      }

      function answerFromTranscript(text) {
        const cleanText = text.trim();
        if (!cleanText) {
          setPunchline('Parle plus fort, gros poka, le micro a entendu le vide la.');
          speak(lastPunchline);
          return;
        }

        transcriptEl.textContent = cleanText;
        const reply = buildReply(cleanText);
        setPunchline(reply);
        speak(reply);
      }

      function stopListening() {
        if (!recognition || !isListening) {
          return;
        }

        try {
          recognition.stop();
        } catch (error) {
          setListeningState(false);
        }
      }

      function startListening() {
        if (!hasSpeechRecognition) {
          setPunchline('Ton navigateur ne gere pas la reconnaissance vocale. Essaie Chrome mobile, mon vieux.');
          return;
        }

        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setSpeakingState(false);
        }

        if (isListening) {
          stopListening();
          return;
        }

        finalTranscript = '';
        recognitionHadError = false;

        try {
          recognition.start();
          setListeningState(true);
          setStatus('Micro ouvert');
          transcriptEl.textContent = 'Je t ecoute...';
        } catch (error) {
          setListeningState(false);
          setStatus('Micro deja actif');
        }
      }

      function configureRecognition() {
        if (!hasSpeechRecognition) {
          supportBadge.textContent = 'Chrome conseille';
          setStatus('Vocal limite');
          micButton.disabled = true;
          micButton.classList.add('opacity-60');
          hintEl.textContent = 'Reconnaissance vocale non supportee ici';
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onresult = event => {
          let interimTranscript = '';

          for (let index = event.resultIndex; index < event.results.length; index += 1) {
            const transcriptPart = event.results[index][0].transcript;
            if (event.results[index].isFinal) {
              finalTranscript += transcriptPart;
            } else {
              interimTranscript += transcriptPart;
            }
          }

          const liveText = finalTranscript || interimTranscript;
          if (liveText) {
            transcriptEl.textContent = liveText;
          }
        };

        recognition.onend = () => {
          if (recognitionHadError) {
            recognitionHadError = false;
            return;
          }

          const capturedText = finalTranscript.trim() || transcriptEl.textContent.trim();
          setListeningState(false);

          if (capturedText && capturedText !== 'Je t ecoute...' && capturedText !== 'Aucune phrase captee pour le moment.') {
            answerFromTranscript(capturedText);
          } else {
            setStatus('Rien capte');
            setPunchline('J ai rien capte, articule avant que je te mette une torgnole la.');
            speak(lastPunchline);
          }
        };

        recognition.onerror = event => {
          recognitionHadError = true;
          setListeningState(false);
          const messages = {
            'not-allowed': 'Micro refuse. Autorise le micro, vieille folle.',
            'no-speech': 'Aucune voix captee. Parle ou bouge ton cul la.',
            network: 'Reseau casse. Meme Canal Satellite fait mieux quoi.'
          };
          const message = messages[event.error] || 'Erreur micro. Recommence propre, gros poka.';
          setStatus('Erreur micro');
          setPunchline(message);
          speak(message);
        };
      }

      function shareOnWhatsApp() {
        const text = `Taz-Bot NC m'a envoye ca : "${lastPunchline}"`;
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;

        if (navigator.share) {
          navigator.share({ text }).catch(() => {
            window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
          });
          return;
        }

        window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
      }

      function bindEvents() {
        micButton.addEventListener('click', () => {
          if (suppressNextClick) {
            suppressNextClick = false;
            return;
          }

          startListening();
        });

        micButton.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse') {
            return;
          }

          holdMode = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            holdMode = true;
            startListening();
          }, 220);
        }, { passive: true });

        micButton.addEventListener('pointerup', event => {
          if (event.pointerType === 'mouse') {
            return;
          }

          clearTimeout(holdTimer);

          if (holdMode) {
            stopListening();
            suppressNextClick = true;
            holdMode = false;
          }
        }, { passive: true });

        micButton.addEventListener('pointercancel', () => {
          clearTimeout(holdTimer);
          if (holdMode) {
            stopListening();
            suppressNextClick = true;
            holdMode = false;
          }
        }, { passive: true });

        shareBtn.addEventListener('click', shareOnWhatsApp);

        if (hasSpeechSynthesis) {
          window.speechSynthesis.onvoiceschanged = selectFrenchVoice;
        }
      }

      configureRecognition();
      bindEvents();
      shareBtn.disabled = false;

      if (!hasSpeechSynthesis) {
        setStatus('TTS indisponible');
      }
    })();
  </script>
</body>
</html>
