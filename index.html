    function setState(mode, label) {
      statePill.textContent = label;
      voiceOrb.classList.toggle("is-voice-active", mode === "listening" || mode === "speaking");
      micBtn.classList.toggle("animate-breathe", mode === "listening");
      micBtn.classList.toggle("from-red-700", mode === "listening");
      micBtn.classList.toggle("to-lava", mode === "listening");
      pulseRing.classList.toggle("animate-ping", mode === "listening" || mode === "speaking");
    }

    function loadVoices() {
      return new Promise((resolve) => {
        const voices = synth.getVoices();
        if (voices.length) {
          resolve(voices);
          return;
        }

        window.speechSynthesis.onvoiceschanged = () => resolve(synth.getVoices());
      });
    }

    async function speak(text) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      synth.cancel();
      const voices = await loadVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "fr-FR";

      const frenchVoice = voices.find((voice) => voice.lang.toLowerCase().startsWith("fr"));
      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      // Ajuster pitch et rate ici pour simuler une voix Kingtaz qui part dans les aigus.
      utterance.pitch = 1.28;
      utterance.rate = 1.18;
      utterance.volume = 1;

      utterance.onstart = () => {
        isSpeaking = true;
        setState("speaking", "taz-bot crie");
        hintText.textContent = "Le bot repond. Laisse-le finir, mon vieux.";
      };

      utterance.onend = utterance.onerror = () => {
        isSpeaking = false;
        setState("idle", "pret a clasher");
        hintText.textContent = "Clique ou maintiens pour parler.";
      };

      synth.speak(utterance);
    }

    function answerFromTranscript(transcript) {
      if (!transcript) {
        const reply = "Parle dans le micro, Gros poka, pas dans ta poche là.";
        updateReply(reply, "");
        speak(reply);
        return;
      }

      const reply = getReply(transcript);
      updateReply(reply, transcript);
      speak(reply);
    }

    function updateReply(reply, transcript) {
      lastReply = reply;
      botText.textContent = reply;
      heardText.textContent = transcript ? `Entendu : "${transcript}"` : "";
    }

    function setupRecognition() {
      if (!SpeechRecognition) {
        supportBadge.textContent = "tts seul";
        statePill.textContent = "micro non supporte";
        hintText.textContent = "Reconnaissance vocale indisponible ici. Essaie Chrome Android.";
        micBtn.addEventListener("click", () => {
          const reply = pickRandom(randomReplies);
          updateReply(reply, "");
          speak(reply);
        });
        return;
      }

      supportBadge.textContent = "vocal ok";
      recognition = new SpeechRecognition();
      recognition.lang = "fr-FR";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        lastTranscript = "";
        synth.cancel();
        setState("listening", "j'ecoute");
        hintText.textContent = "Vas-y, parle maintenant.";
        heardText.textContent = "";
      };

      recognition.onresult = (event) => {
        let interim = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const transcript = event.results[index][0].transcript.trim();
          if (event.results[index].isFinal) {
            lastTranscript += `${transcript} `;
          } else {
            interim += transcript;
          }
        }

        const preview = (lastTranscript || interim).trim();
        heardText.textContent = preview ? `Entendu : "${preview}"` : "";
      };

      recognition.onerror = (event) => {
        isListening = false;
        setState("idle", "erreur micro");
        const reply = event.error === "not-allowed"
          ? "Autorise le micro, Vieille folle, sinon je parle tout seul quoi."
          : "Ton micro fait le mort, Gros poka. Recommence là.";
        updateReply(reply, "");
        speak(reply);
      };

      recognition.onend = () => {
        const captured = lastTranscript.trim();
        isListening = false;
        setState("thinking", "je calcule");

        if (captured) {
          window.setTimeout(() => answerFromTranscript(captured), 180);
        } else if (!isSpeaking) {
          setState("idle", "pret a clasher");
          hintText.textContent = "Je n'ai rien capte. Recommence sec.";
        }
      };
    }

    function startListening() {
      if (!recognition || isListening || isSpeaking) {
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        setState("idle", "micro bloque");
        const reply = "Doucement enculé, le micro n'a pas fini de respirer là.";
        updateReply(reply, "");
        speak(reply);
      }
    }

    function stopListening() {
      if (!recognition || !isListening) {
        return;
      }

      recognition.stop();
    }

    async function shareClash() {
      const text = `Taz-Bot NC : ${lastReply}`;
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;

      if (navigator.share) {
        try {
          await navigator.share({ text });
          return;
        } catch (error) {
          if (error.name === "AbortError") {
            return;
          }
        }
      }

      window.open(whatsappUrl, "_blank", "noopener,noreferrer");
    }

    micBtn.addEventListener("click", () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }

      startListening();
    });
    micBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      pressStartedAt = Date.now();
      suppressNextClick = true;
      startListening();
    });
    micBtn.addEventListener("pointerup", () => {
      const pressDuration = Date.now() - pressStartedAt;
      if (pressDuration > 320) {
        stopListening();
      }
    });
    micBtn.addEventListener("pointercancel", stopListening);
    micBtn.addEventListener("pointerleave", () => {
      if (isListening && Date.now() - pressStartedAt > 320) {
        stopListening();
      }
    });
    shareBtn.addEventListener("click", shareClash);

    window.addEventListener("beforeunload", () => {
      if (recognition && isListening) {
        recognition.stop();
      }
      if ("speechSynthesis" in window) {
        synth.cancel();
      }
    });

    setupRecognition();
  </script>
</body>
</html>
